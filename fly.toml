# Fly.io config at the repo ROOT. Launch/deploy from the repo root:
#   fly launch --no-deploy      (decline its DB offer — you use Supabase)
#   fly secrets set DATABASE_URL="..." JWT_SECRET="..." CORS_ORIGINS="https://your-site.vercel.app"
#   fly deploy
app = "ludo-king-match"
primary_region = "ams"          # Amsterdam; change to one near your players

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1       # keep 1 running so join timers / sockets stay alive

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
